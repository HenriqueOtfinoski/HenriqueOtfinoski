<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/><stop offset="0.5" stop-color="#203a43"/><stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="900" height="200" rx="14" fill="url(#bg)"/>
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.25">
    <circle cx="80" cy="40" r="30"><animate attributeName="r" values="30;42;30" dur="5s" repeatCount="indefinite"/></circle>
